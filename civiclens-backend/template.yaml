AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CivicLens - Gemma 4 Multimodal Community Intelligence Infrastructure

Resources:
  # S3 Bucket for Raw Notices and Media
  CivicIngestionBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "civiclens-ingest-${AWS::AccountId}"

  # DynamoDB Table for Extracted Civic Tickets
  CivicActionTicketsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CivicActionTickets
      AttributeDefinitions:
        - AttributeName: TicketId
          AttributeType: S
      KeySchema:
        - AttributeName: TicketId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  # SNS Topic for Community Broadcast Alerts
  CivicAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: CivicAlerts

  # Lambda Orchestrator
  GemmaOrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      CodeUri: ./
      Timeout: 90
      MemorySize: 1024
      Environment:
        Variables:
          GEMMA_ENDPOINT_URL: "http://YOUR_EC2_OR_SAGEMAKER_IP:8000/v1/chat/completions"
          TABLE_NAME: !Ref CivicActionTicketsTable
          SNS_TOPIC_ARN: !Ref CivicAlertsTopic
      Policies:
        - AmazonS3ReadOnlyAccess
        - DynamoDBCrudPolicy:
            TableName: !Ref CivicActionTicketsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt CivicAlertsTopic.TopicName
      Events:
        FileUploadEvent:
          Type: S3
          Properties:
            Bucket: !Ref CivicIngestionBucket
            Events: s3:ObjectCreated:*
